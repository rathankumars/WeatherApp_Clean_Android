name: Android CI - Debug APK with PR Comment

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 🔹 Build ONLY the presentation module debug APK
      - name: Build Presentation Debug APK
        run: ./gradlew :presentation:clean :presentation:assembleDebug --no-daemon

      # 🔹 Upload presentation module APK
      - name: Upload Presentation Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: presentation-debug-apk
          path: presentation/build/outputs/apk/debug/*.apk

      - name: Create or Update PR Comment with Artifact Link
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- apk-comment -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            // PR comment will always point to the workflow run artifacts page
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            // Build comment body safely (no YAML issues)
            const body = [
              marker,
              "### 🚀 Debug APK is Ready",
              "Download the APK from the workflow artifacts:",
              `🔗 ${runUrl}`,
              "",
              "(This comment is auto-updated on every push)"
            ].join("\n");

            // 1. Fetch existing PR comments
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.data.find(c => c.body && c.body.includes(marker));

            // 2. Update if exists, otherwise create new
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
