name: Android CI - Build Debug APK + Post Direct Artifact Link

on:
  pull_request:
    branches: [ main ]    # change to your target branch(es)
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # --- Post a direct download URL for the artifact to the PR conversation ---
      - name: Post direct artifact download link to PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          # MUST use a PAT for forked PRs; store PAT in repo secrets as PAT_TOKEN (repo scope)
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const artifactName = "app-debug-apk";

            // List artifacts for this workflow run
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
            });

            const artifacts = response.data.artifacts || [];
