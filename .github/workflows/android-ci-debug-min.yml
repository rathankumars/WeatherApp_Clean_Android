name: Android CI - Minimal Debug APK (Java 17)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # AdoptOpenJDK/Temurin — works well; you can use 'zulu' or other vendors
          java-version: '17'

      - name: Print Java & Gradle versions (sanity check)
        run: |
          java -version
          echo "JAVA_HOME = $JAVA_HOME"
          ./gradlew --version

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
